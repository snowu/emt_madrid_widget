<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12141a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Buses</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Buses</h1>
      <button id="refresh-all" type="button" aria-label="Refresh all" title="Refresh all">↻</button>
      <nav id="view-toggle" class="segmented" aria-label="View">
        <button id="view-list" type="button" aria-selected="true">List</button>
        <button id="view-map" type="button" aria-selected="false">Map</button>
      </nav>
    </header>

    <p id="status" role="status"></p>

    <main id="stops" aria-live="polite"></main>

    <div id="map" hidden></div>

    <footer>Data from <a href="https://mobilitylabs.emtmadrid.es">EMT MobilityLabs</a>.</footer>

    <button id="fab" type="button" aria-label="Add stop" title="Add stop">+</button>

    <dialog id="add-dialog">
      <form id="add-stop" method="dialog">
        <h2>Add stop</h2>
        <input
          id="stop-id"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="Stop number"
          autocomplete="off"
          required
          aria-label="EMT stop number"
        />
        <input
          id="stop-label"
          placeholder="Label (optional)"
          autocomplete="off"
          aria-label="Label"
        />
        <div class="dialog-actions">
          <button type="button" id="add-cancel">Cancel</button>
          <button type="submit" id="add-save">Add</button>
        </div>
      </form>
    </dialog>

    <dialog id="stop-dialog">
      <form id="stop-form" method="dialog">
        <h2 id="sheet-heading">Stop</h2>
        <p id="sheet-meta" class="stop-num"></p>
        <div id="sheet-map"></div>
        <p id="sheet-no-map" class="muted" hidden>EMT has no location for this stop.</p>
        <ul id="sheet-arrivals"></ul>
        <p id="sheet-age" class="age"></p>
        <details id="sheet-service-wrap">
          <summary>Lines and hours today</summary>
          <ul id="sheet-service"></ul>
        </details>
        <label class="field">
          <span>Name</span>
          <input id="sheet-label" autocomplete="off" placeholder="EMT's name" />
        </label>
        <div class="dialog-actions">
          <button type="button" id="sheet-remove" class="danger">Remove</button>
          <button type="button" id="sheet-refresh" title="Refresh">↻</button>
          <button type="button" id="sheet-close">Close</button>
          <button type="submit" id="sheet-save">Save</button>
        </div>
      </form>
    </dialog>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
