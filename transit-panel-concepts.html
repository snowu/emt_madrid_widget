<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Active lines — board + moving buses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0E1218;--surface:#161B23;--surface-2:#1E242E;--hair:rgba(255,255,255,.09);
        --text:#EAEDF3;--muted:#8B94A6;--accent:#5B9DFF}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--text);font-family:'Archivo',system-ui,sans-serif;font-size:15px;
       line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .lab{background:#080A0E;padding:10px 12px;border-bottom:1px solid var(--hair);flex:none;display:flex;align-items:center;gap:8px}
  .lab-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:none}
  .seg{display:flex;gap:4px;background:#12161D;border-radius:10px;padding:3px;flex:1}
  .seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}

  .app{flex:1;display:flex;flex-direction:column;min-height:0}
  .topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;flex:none}
  .pillbtn{background:var(--surface);border:1px solid var(--hair);border-radius:12px;height:38px;display:flex;
           align-items:center;gap:7px;padding:0 12px;font-size:13px;font-weight:600}
  .dot-live{width:7px;height:7px;border-radius:50%;background:#3ED27F;box-shadow:0 0 8px #3ED27F}
  .spacer{flex:1}
  .viewseg{display:flex;background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:3px;height:38px}
  .viewseg button{padding:0 13px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
  .viewseg button[aria-pressed="true"]{background:var(--accent);color:#06101F}

  .map{flex:1;position:relative;margin:0 12px;border-radius:18px;overflow:hidden;background:#0F1319;min-height:140px}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .attrib{position:absolute;left:0;right:0;bottom:0;font-size:10px;color:#9aa3b2;background:rgba(8,10,14,.62);padding:3px 8px}
  .bus{cursor:pointer}

  .sheet{flex:none;background:var(--surface);border-top:1px solid var(--hair);border-radius:20px 20px 0 0;
         margin-top:10px;padding-bottom:env(safe-area-inset-bottom);position:relative}
  .grab{width:36px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:8px auto 0}
  .sheet-head{display:flex;align-items:baseline;gap:8px;padding:10px 16px 8px}
  .sheet-title{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .count{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--surface-2);border-radius:6px;padding:1px 6px}
  .headbtn{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
  .clear{font-size:12px;font-weight:600;color:#FF7B7B}
  .board{max-height:34vh;overflow-y:auto;overscroll-behavior:contain}
  .row{display:flex;align-items:center;gap:10px;height:44px;padding-right:6px}
  .row + .row{box-shadow:0 -1px 0 rgba(255,255,255,.05)}
  .row[aria-pressed="true"]{background:rgba(91,157,255,.10)}
  .spine{width:4px;height:26px;border-radius:99px;flex:none;margin-left:12px}
  .num{font-size:19px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;width:52px;text-align:right;flex:none}
  .dest{flex:1;min-width:0;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
        font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .eta{font-family:'IBM Plex Mono',monospace;font-size:13px;flex:none;text-align:right;min-width:54px}
  .eta small{font-size:10px;color:var(--muted);margin-left:2px}
  .eta.soon{color:#3ED27F}
  .x{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;color:#5C6577;font-size:17px}
  .empty{padding:6px 16px 18px;color:var(--muted);font-size:13px}
  .undo{position:absolute;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));background:#2A3241;
        border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .undo button{margin-left:auto;font-weight:700;color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="lab">
  <span class="lab-label">Bus</span>
  <div class="seg" id="segMarker">
    <button data-v="bus" aria-pressed="true">Bus</button>
    <button data-v="arrow" aria-pressed="false">Arrow</button>
  </div>
  <button class="lab-label" id="pause" style="border:1px solid var(--hair);border-radius:8px;padding:7px 10px">Pause</button>
</div>

<div class="app">
  <div class="topbar">
    <div class="pillbtn">☰</div>
    <div class="pillbtn"><span class="dot-live"></span>At home</div>
    <div class="spacer"></div>
    <div class="viewseg"><button aria-pressed="false">List</button><button aria-pressed="true">Map</button></div>
  </div>

  <div class="map">
    <svg id="mapsvg" viewBox="0 0 360 420" preserveAspectRatio="xMidYMid slice">
      <rect width="360" height="420" fill="#0F1319"/>
      <path d="M250 20 L330 60 L340 150 L270 170 L245 90Z" fill="#16241B"/>
      <path d="M20 300 L80 290 L95 360 L30 375Z" fill="#16241B"/>
      <g stroke="#1D2430" stroke-width="1.2">
        <path d="M0 60H360M0 120H360M0 180H360M0 240H360M0 300H360M0 360H360"/>
        <path d="M40 0V420M90 0V420M140 0V420M200 0V420M260 0V420M320 0V420"/>
      </g>
      <g stroke="#2A3342" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M-10 160 C 90 120, 150 200, 250 150 S 360 120 370 140"/>
        <path d="M-10 330 C 120 300, 240 350, 370 300"/>
      </g>
      <g id="routes" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
      <g id="fleet"></g>
      <g>
        <circle cx="170" cy="140" r="14" fill="#5B9DFF" opacity=".16"/>
        <circle cx="170" cy="140" r="7" fill="#5B9DFF" stroke="#fff" stroke-width="3"/>
      </g>
    </svg>
    <div class="attrib">Leaflet · © OpenStreetMap contributors</div>
  </div>

  <div class="sheet" id="sheet"></div>
</div>

<script>
const LINES=[
 {id:'se833',n:'SE833',dest:'Las Tablas',c:'#38BDF8',eta:2, sp:22,
  d:'M20 400 L20 300 L90 300 L90 180 L200 180 L200 60 L320 60'},
 {id:'l70', n:'70', dest:'Alsacia',c:'#D9A05B',eta:4, sp:18,
  d:'M340 400 L260 400 L260 300 L140 300 L140 120 L40 120'},
 {id:'l5',  n:'5',  dest:'Estación de Chamartín',c:'#3ED27F',eta:5, sp:20,
  d:'M60 420 L60 240 L140 240 L140 60 L140 -10'},
 {id:'l129',n:'129',dest:'Manoteras',c:'#A78BFA',eta:7, sp:24,
  d:'M0 240 L90 240 L90 120 L200 120 L200 20 L280 20'},
 {id:'l107a',n:'107',dest:'Hortaleza',c:'#E2764A',eta:8, sp:19,
  d:'M320 360 L320 180 L260 180 L260 60 L200 60 L200 0'},
 {id:'l107b',n:'107',dest:'Plaza de Castilla',c:'#E2764A',eta:12,sp:19,
  d:'M200 0 L200 60 L260 60 L260 180 L320 180 L320 360'},
 {id:'l87', n:'87', dest:'Pza. República Dominicana',c:'#6366F1',eta:13,sp:21,
  d:'M360 100 L260 100 L260 240 L140 240 L140 360 L40 360'},
 {id:'l52', n:'52', dest:'Puerta del Sol / Sevilla',c:'#4EA8F5',eta:15,sp:17,
  d:'M40 20 L40 180 L110 180 L110 300 L200 300 L200 420'},
 {id:'l43', n:'43', dest:'Estrecho',c:'#EF5350',eta:16,sp:23,
  d:'M260 420 L260 300 L170 300 L170 180 L170 60 L100 60 L100 0'},
 {id:'l120',n:'120',dest:'Plaza de Lima',c:'#EC6F9E',eta:18,sp:20,
  d:'M0 60 L90 60 L90 200 L200 200 L200 340 L340 340'},
 {id:'sc2', n:'SC2',dest:'Legazpi',c:'#C04BD6',eta:21,sp:16,
  d:'M120 0 L120 140 L40 140 L40 260 L120 260 L120 420'},
 {id:'s10', n:'S10',dest:'Plaza Castilla',c:'#2DD4A7',eta:24,sp:25,
  d:'M300 420 L300 260 L220 260 L220 140 L300 140 L300 0'},
 {id:'nc1', n:'NC1',dest:'Estación de Atocha',c:'#F472B6',eta:30,sp:15,
  d:'M0 380 L120 380 L120 220 L240 220 L240 100 L360 100'}
];

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let state={marker:'bus',sel:null,removed:[],sortBy:'eta',lines:LINES.slice(),running:!REDUCED};
const svgNS='http://www.w3.org/2000/svg';

function ink(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000>150?'#0E1218':'#FFFFFF';}

/* ---------- build routes + fleet ---------- */
const routesG=document.getElementById('routes'), fleetG=document.getElementById('fleet');
function build(){
  routesG.innerHTML=''; fleetG.innerHTML='';
  state.lines.forEach(l=>{
    const p=document.createElementNS(svgNS,'path');
    p.setAttribute('d',l.d); p.setAttribute('stroke',l.c); p.setAttribute('stroke-width','2');
    routesG.appendChild(p); l.path=p; l.len=p.getTotalLength();
    if(l.pos===undefined) l.pos=Math.random()*l.len;
    l.hold=0;
    const g=document.createElementNS(svgNS,'g'); g.setAttribute('class','bus'); g.dataset.id=l.id;
    fleetG.appendChild(g); l.g=g;
  });
  paint();
}

function shape(l,ang){
  const fg=ink(l.c), long=l.n.length>3;
  if(state.marker==='arrow'){
    const w=long?60:48,tip=10,rad=(ang)*Math.PI/180,ox=-(tip/2)*Math.sin(rad),oy=(tip/2)*Math.cos(rad);
    return `<g transform="rotate(${ang-90})"><path d="M${-w/2} -11 h${w-tip} l${tip} 11 l-${tip} 11 h-${w-tip}
      a6 6 0 0 1 -6 -6 v-10 a6 6 0 0 1 6 -6 z" fill="${l.c}" stroke="#0B0E13" stroke-width="2" stroke-linejoin="round"/></g>
      <text x="${ox.toFixed(2)}" y="${(oy+5).toFixed(2)}" text-anchor="middle" fill="${fg}"
        font-weight="800" font-size="${long?12:15}" letter-spacing="-.3">${l.n}</text>`;
  }
  /* top-down bus: nose forward, windscreen, side windows, wheels */
  return `<g transform="rotate(${ang})">
      <rect x="-11.5" y="-21.5" width="23" height="43" rx="8" fill="#0B0E13" opacity=".55"/>
      <path d="M-9 -18 q9 -5 18 0 v33 q-9 4 -18 0 z" fill="${l.c}" stroke="#0B0E13" stroke-width="1.6"/>
      <path d="M-7.4 -16.4 q7.4 -3.6 14.8 0 v4.6 q-7.4 -2.6 -14.8 0 z" fill="#0B0E13" opacity=".55"/>
      <rect x="-8.6" y="-7" width="2.6" height="16" rx="1.2" fill="#0B0E13" opacity=".45"/>
      <rect x="6" y="-7" width="2.6" height="16" rx="1.2" fill="#0B0E13" opacity=".45"/>
      <rect x="-10.6" y="-10" width="2" height="6" rx="1" fill="#0B0E13"/>
      <rect x="8.6" y="-10" width="2" height="6" rx="1" fill="#0B0E13"/>
      <rect x="-10.6" y="7" width="2" height="6" rx="1" fill="#0B0E13"/>
      <rect x="8.6" y="7" width="2" height="6" rx="1" fill="#0B0E13"/>
    </g>
    <g><rect x="${l.n.length>3?-17:-13}" y="-8" width="${l.n.length>3?34:26}" height="16" rx="5"
        fill="#0B0E13" stroke="${l.c}" stroke-width="1.6"/>
      <text y="4.6" text-anchor="middle" fill="${l.c}" font-weight="800"
        font-size="${l.n.length>3?11:13}" letter-spacing="-.3">${l.n}</text></g>`;
}

function paint(){
  state.lines.forEach(l=>{
    const p=l.path.getPointAtLength(l.pos);
    const q=l.path.getPointAtLength(Math.min(l.pos+2,l.len));
    const ang=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI+90;
    const dim=state.sel&&state.sel!==l.id;
    l.g.setAttribute('transform',`translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) scale(${state.sel===l.id?1.15:1})`);
    l.g.setAttribute('opacity',dim?.45:1);
    l.g.innerHTML=shape(l,ang);
    l.path.setAttribute('opacity',dim?.14:(state.sel===l.id?.9:.42));
    l.path.setAttribute('stroke-width',state.sel===l.id?3:2);
  });
}

/* ---------- motion: constant speed, instant heading change at corners,
             brief hold at each stop ---------- */
let last=performance.now();
function tick(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  if(state.running){
    state.lines.forEach(l=>{
      if(l.hold>0){ l.hold-=dt; return; }
      const before=l.pos; l.pos+=l.sp*dt;
      if(Math.floor(before/70)!==Math.floor(l.pos/70)) l.hold=.9;   // stop dwell
      if(l.pos>l.len) l.pos-=l.len;
    });
    paint();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- board ---------- */
function sorted(){return state.sortBy==='eta'?state.lines.slice().sort((a,b)=>a.eta-b.eta)
  :state.lines.slice().sort((a,b)=>a.n.localeCompare(b.n,'es',{numeric:true}));}
function render(){
  const s=document.getElementById('sheet');
  const head=`<div class="grab"></div><div class="sheet-head"><span class="sheet-title">Following</span>
    <span class="count">${state.lines.length}</span>
    <button class="headbtn" data-act="sort">Sort · ${state.sortBy==='eta'?'soonest':'line'}</button>
    <button class="clear" data-act="clearall">Clear all</button></div>`;
  const undo=state.removed.length?`<div class="undo">Stopped following ${state.removed[state.removed.length-1].n}
    <button data-act="undo">Undo</button></div>`:'';
  if(!state.lines.length){s.innerHTML=head+`<div class="empty">Nothing followed yet. Tap a bus on the map to follow its line.</div>`+undo;return;}
  s.innerHTML=head+`<div class="board">`+sorted().map(l=>`
    <div class="row" data-id="${l.id}" aria-pressed="${state.sel===l.id}">
      <span class="spine" style="background:${l.c}"></span>
      <span class="num" style="color:${l.c}">${l.n}</span>
      <span class="dest">${l.dest}</span>
      <span class="eta${l.eta<=3?' soon':''}">${l.eta}<small>min</small></span>
      <button class="x" data-act="rm" data-id="${l.id}" aria-label="Stop following ${l.n}">✕</button>
    </div>`).join('')+`</div>`+undo;
}

document.getElementById('sheet').addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  if(act){const a=act.dataset.act;
    if(a==='rm'){const i=state.lines.findIndex(l=>l.id===act.dataset.id);
      state.removed.push(state.lines.splice(i,1)[0]); if(state.sel===act.dataset.id)state.sel=null; build();}
    if(a==='undo'){state.lines.push(state.removed.pop()); build();}
    if(a==='clearall'){state.removed=state.removed.concat(state.lines); state.lines=[]; state.sel=null; build();}
    if(a==='sort'){state.sortBy=state.sortBy==='eta'?'line':'eta';}
    return render();}
  const hit=e.target.closest('[data-id]');
  if(hit){state.sel=state.sel===hit.dataset.id?null:hit.dataset.id; render(); paint();}
});
fleetG.addEventListener('click',e=>{
  const g=e.target.closest('.bus'); if(!g)return;
  state.sel=state.sel===g.dataset.id?null:g.dataset.id; render(); paint();
});
document.getElementById('segMarker').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  state.marker=b.dataset.v;[...e.currentTarget.children].forEach(c=>c.setAttribute('aria-pressed',c===b)); paint();
});
document.getElementById('pause').addEventListener('click',e=>{
  state.running=!state.running; e.currentTarget.textContent=state.running?'Pause':'Play';
});
build(); render();
</script>
</body>
</html>
