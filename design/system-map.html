<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hubwise system map</title><link rel="stylesheet" href="../web/style.css"><style>body{min-height:100dvh}.map-art{position:relative;height:calc(100dvh - 15rem);min-height:440px;overflow:hidden}.map-art:before,.map-art:after{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(28deg,transparent 0 44px,rgb(100 231 255 / .12) 45px 47px,transparent 48px 90px);transform:rotate(-12deg)}.map-art:after{inset:20% -10%;transform:rotate(24deg);opacity:.5}.map-node{position:absolute;z-index:2;width:24px;height:24px;border:3px solid var(--signal-cyan);border-radius:50%;background:var(--signal-panel);box-shadow:0 0 0 4px var(--signal-ink)}.map-node.good{border-color:var(--signal-lime)}.map-node.tracked{border-color:#e879f9;box-shadow:0 0 0 4px var(--signal-ink),0 0 0 7px #e879f9}.map-label{position:absolute;z-index:3;padding:.25rem .4rem;border:1px solid var(--signal-line);background:var(--signal-panel);color:var(--fg);font:700 .65rem ui-monospace,monospace}.map-popup{position:absolute;z-index:4;left:12%;top:30%;width:220px;padding:.75rem;border:1px solid var(--signal-cyan);background:var(--signal-panel);box-shadow:5px 5px 0 var(--signal-ink)}.map-popup h2{margin:0;font-size:.9rem}.map-popup p{margin:.25rem 0;color:var(--signal-muted);font-size:.7rem}.map-popup .bike-metric strong{color:var(--signal-lime)}</style></head>
