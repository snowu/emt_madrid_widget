name = "emt-arrivals"
main = "src/index.js"
compatibility_date = "2026-08-18"
# Required by @cloudflare/vitest-pool-workers.
compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "KV", id = "cb1456cfd7644e5cbbcee852d3eed51e" }
]

[vars]
# Secrets are NOT here. Set them with `wrangler secret put <NAME>`,
# or locally in .dev.vars (gitignored). Test fakes live in vitest.config.js,
# NOT here — a [vars] name collides with its secret at creation time.
ALLOWED_ORIGIN = "https://snowu.github.io"

[triggers]
crons = ["*/30 * * * *"]
